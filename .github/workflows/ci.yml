name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Zombies.slnx
      - name: Build
        run: dotnet build Zombies.slnx --configuration Release --no-restore
      - name: Compiled shaders are up to date
        if: runner.os == 'Windows'
        run: git diff --exit-code -- src/Zombies.Engine.Render.Vulkan/Shaders/compiled
      - name: Test
        run: dotnet test --solution Zombies.slnx --configuration Release --no-build
      - name: SimHarness
        run: dotnet run --project tools/SimHarness --configuration Release --no-build
      - name: SimHarness loads the repository mods
        run: dotnet run --project tools/SimHarness --configuration Release --no-build -- mods mods
      - name: SimHarness generates and meshes a patch of world
        run: dotnet run --project tools/SimHarness --configuration Release --no-build -- worldgen 12345 4 --budget-ms 12
      - name: SimHarness runs a Server with two fake clients
        run: dotnet run --project tools/SimHarness --configuration Release --no-build -- net 300 mods
      - name: SimHarness drops a player onto terrain and steps up a ledge
        run: dotnet run --project tools/SimHarness --configuration Release --no-build -- physics 12345 mods
      - name: Dedicated Server starts and ticks headless
        run: dotnet run --project src/Zombies.Server --configuration Release --no-build -- --port 0 --ticks 30
